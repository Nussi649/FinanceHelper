apply plugin: 'com.android.application'

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.privat.pitz.financehelper"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.privat.pitz.financehelper'
    testOptions {
        unitTests {
            // Android stub methods (e.g. android.util.Log.println, called from error paths in
            // Logic/BudgetAccountBE and Backend/Util) throw by default under JVM unit tests;
            // this makes them return default values instead so those code paths are testable.
            returnDefaultValues = true

            // Gradle enables Java assertions in test JVMs by default. Android never does, so
            // `assert expr;` is a no-op on a device - the expression is not even evaluated.
            // Leaving assertions on here made the tests disagree with the device on exactly the
            // code that uses assert as a guard, which hid real bugs. Match the device.
            all {
                enableAssertions = false
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation for JVM unit tests, since the Android SDK stub for org.json
    // throws "not mocked" and returnDefaultValues does not make it produce real JSON behavior.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Fails the build if `assert` is used as a Java-language statement anywhere in app/src/main.
// WHY: assertions are disabled by default on the JVM and Android never enables them at all -
// `assert expr;` is a complete no-op on device, expr is not even evaluated. This codebase used
// to rely on `assert x != null;` as a guard in several places; those guards silently never ran
// and shipped real bugs (a crash and a data-loss path - see docs/known-issues.md, "Guards written
// with `assert` never ran on device"). Write a real `if`/`throw`/log check instead.
// Only flags lines that actually start with the `assert` keyword (after trimming whitespace), so
// comments that merely mention the word "assert" are left alone.
task banAssertStatements {
    doLast {
        def offenders = []
        fileTree(dir: 'src/main', include: '**/*.java').each { File file ->
            int lineNumber = 0
            file.eachLine { line ->
                lineNumber++
                String trimmed = line.trim()
                if (trimmed.startsWith('assert ') || trimmed.startsWith('assert(') || trimmed == 'assert;') {
                    offenders << "${file.path}:${lineNumber}: ${trimmed}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Found ${offenders.size()} bare `assert` statement(s) in app/src/main - assert " +
                    "is a no-op on Android and must not be used as a guard. Replace with a real " +
                    "if/throw/log check. Offending lines:\n" + offenders.join('\n'))
        }
    }
}
afterEvaluate {
    tasks.findByName('preBuild')?.dependsOn(banAssertStatements)
    tasks.findByName('check')?.dependsOn(banAssertStatements)
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-stdlib-jdk8') {
            details.useVersion '1.8.10'
        }
    }
}
