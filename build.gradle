// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // MSAL pulls in one Microsoft-only artifact (dual-screen device support) that is not on
        // Maven Central; the filter keeps this repository from serving anything else
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
            content { includeGroup 'com.microsoft.device.display' }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
